<body>

<div class="container">

    <div class="card">

        <h1> AI Powered Text to Speech Converter</h1>
        <label>Select Voice</label>

        <select id="voiceSelected">

            <optgroup label="🇺🇸 English">

                <option value="Joanna">Joanna (Female)</option>
                <option value="Matthew">Matthew (Male)</option>
                <option value="Amy">Amy (British Female)</option>
                <option value="Brian">Brian (British Male)</option>

            </optgroup>

            <optgroup label="🇮🇳 Indian">

                <option value="Aditi">Aditi (Hindi/English)</option>

            </optgroup>

            <optgroup label="🇫🇷 French">

                <option value="Mathieu">Mathieu</option>

            </optgroup>

            <optgroup label="🇩🇪 German">

                <option value="Marlene">Marlene</option>

            </optgroup>

            <optgroup label="🇮🇹 Italian">

                <option value="Carla">Carla</option>

            </optgroup>

            <optgroup label="🇪🇸 Spanish">

                <option value="Enrique">Enrique</option>

            </optgroup>

            <optgroup label="🇯🇵 Japanese">

                <option value="Mizuki">Mizuki</option>

            </optgroup>

            <optgroup label="🇷🇺 Russian">

                <option value="Tatyana">Tatyana</option>

            </optgroup>

        </select>

        <textarea
            id="postText"
            placeholder="Type something you want to convert into speech..."
        ></textarea>

        <div class="counter">

            <span id="charCounter">0 Characters</span>

        </div>

        <div class="buttons">

            <button id="sayButton">

                🎤 Convert

            </button>

            <button id="searchButton">

                🔄 Refresh

            </button>

        </div>

        <div id="postIDreturned"></div>

    </div>

</div>

<div class="table-container">

<table id="posts">

<thead>

<tr>

<th>Voice</th>

<th>Text</th>

<th>Status</th>

<th>Audio</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<script src="scripts.js"></script>

</body>
